<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriMithra - Voice AI for Farmers</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f3f8ee;margin:0;color:#1d3a1d}
  .wrap{max-width:560px;margin:0 auto;padding:20px}
  h1{margin:0;color:#2e7d32} .sub{margin:2px 0 16px;color:#555}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
  label{font-size:13px;color:#555;display:block;margin-bottom:4px}
  input,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;margin-bottom:8px}
  #mic{display:block;margin:10px auto;width:110px;height:110px;border-radius:50%;border:none;background:#2e7d32;color:#fff;font-size:42px;cursor:pointer}
  #mic.on{background:#c62828;animation:p 1s infinite}
  @keyframes p{50%{transform:scale(1.07)}}
  #status{text-align:center;color:#555;min-height:20px}
  .bubble{padding:10px;border-radius:10px;margin:6px 0;white-space:pre-wrap}
  .you{background:#e8f5e9} .bot{background:#fff8e1}
  button.s{padding:8px 12px;border:1px solid #2e7d32;background:#fff;color:#2e7d32;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>AgriMithra <span style="font-weight:400">అగ్రిమిత్ర</span></h1>
  <div class="sub">Your friend who speaks your language.</div>

  <div class="card">
    <label>Free Gemini API key (aistudio.google.com/apikey)</label>
    <input id="key" type="password" placeholder="Paste key here">
    <label>Language</label>
    <select id="lang">
      <option value="te-IN|Telugu">తెలుగు (Telugu)</option>
      <option value="hi-IN|Hindi">हिन्दी (Hindi)</option>
      <option value="ta-IN|Tamil">தமிழ் (Tamil)</option>
      <option value="en-IN|English">English</option>
    </select>
    <label>Model (change if you get a model error)</label>
    <input id="model" value="gemini-2.5-flash">
    <label>Farmer profile (AgriMithra remembers this)</label>
    <input id="profile" value="Ramesh, village near Tirupati, Andhra Pradesh, 2 acres, grows paddy and groundnut">
  </div>

  <button id="mic">🎤</button>
  <div id="status">Tap the mic and ask anything</div>

  <div class="card" style="text-align:center">
    <label>Or send a leaf / pesticide label photo</label>
    <input type="file" id="photo" accept="image/*" capture="environment">
  </div>

  <div id="chat"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), status = $('status'), mic = $('mic');
let history = [];

function add(cls, text){
  const d = document.createElement('div');
  d.className = 'bubble ' + cls; d.textContent = text;
  chat.prepend(d);
}
function langInfo(){ const [code, name] = $('lang').value.split('|'); return {code, name}; }

function speak(text){
  const {code} = langInfo();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = code; u.rate = 0.95;
  const v = speechSynthesis.getVoices().find(v => v.lang === code || v.lang.replace('_','-') === code);
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

async function askGemini(userText, imageB64, mime){
  const key = $('key').value.trim();
  if (!key){ alert('Paste your Gemini API key first'); return null; }
  const {name} = langInfo();
  const system = `You are AgriMithra, a friendly voice assistant for Indian farmers who cannot read. ` +
    `Always reply ONLY in ${name}, in very simple spoken words, maximum 3 short sentences. ` +
    `No markdown, no lists, no symbols, because your answer will be read aloud. ` +
    `Farmer profile: ${$('profile').value}. ` +
    `Give practical advice on crops, pests, weather, mandi prices, fertilizer and pesticide safety. ` +
    `If a pesticide is involved, always include the safety step. If unsure, say so and suggest the local KVK or agriculture officer.`;
  const parts = [];
  if (imageB64) parts.push({inline_data:{mime_type:mime, data:imageB64}});
  parts.push({text: userText});
  history.push({role:'user', parts});
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${$('model').value.trim()}:generateContent?key=${key}`;
  let res, data;
  for (let attempt = 1; attempt <= 5; attempt++) {
    res = await fetch(url, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({system_instruction:{parts:[{text:system}]}, contents: history.slice(-8)})
    });
    data = await res.json();
    if (res.ok) break;
    const busy = res.status === 503 || res.status === 429 || /high demand/i.test(data.error?.message || '');
    if (!busy || attempt === 5) { history.pop(); throw new Error(data.error?.message || 'API error'); }
    status.textContent = `Server busy, retrying (${attempt}/5)…`;
    await new Promise(r => setTimeout(r, 2000 * attempt));
  }
  const out = data.candidates[0].content.parts.map(p => p.text || '').join('').trim();
  history.push({role:'model', parts:[{text: out}]});
  return out;
}

async function handle(userText, img, mime){
  add('you', '🧑‍🌾 ' + userText);
  status.textContent = 'Thinking…';
  try {
    const ans = await askGemini(userText, img, mime);
    if (!ans) { status.textContent = ''; return; }
    add('bot', '🌱 ' + ans);
    status.textContent = 'Speaking…';
    speak(ans);
    setTimeout(() => status.textContent = 'Tap the mic and ask anything', 1500);
  } catch(e){
    status.textContent = 'Error: ' + e.message;
  }
}

// Speech recognition (Chrome)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
mic.onclick = () => {
  if (!SR){ alert('Please use Google Chrome'); return; }
  if (rec){ rec.stop(); return; }
  rec = new SR();
  rec.lang = langInfo().code;
  rec.interimResults = false;
  rec.onstart = () => { mic.classList.add('on'); status.textContent = 'Listening… speak now'; };
  rec.onresult = e => handle(e.results[0][0].transcript);
  rec.onerror = e => { status.textContent = 'Mic error: ' + e.error; };
  rec.onend = () => { mic.classList.remove('on'); rec = null; };
  rec.start();
};

// Photo input (pest / label)
$('photo').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const b64 = r.result.split(',')[1];
    handle('Look at this photo. If it is a crop leaf, tell me the problem and what to do. If it is a pesticide or fertilizer label, tell me the dose and safety steps.', b64, f.type);
  };
  r.readAsDataURL(f);
};
speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
